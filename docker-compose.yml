services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval \"db.adminCommand('ping')\" --quiet"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: apps/api-node
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongo:27017/iiconacademy
      DB_NAME: iiconacademy
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      UPLOAD_DIR: /data/uploads
      PORT: 8000
      HOST: 0.0.0.0
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@iiconacademy.com}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-Admin@1234}
      DEFAULT_ADMIN_NAME: ${DEFAULT_ADMIN_NAME:-Platform Admin}
      # One-time rescue: set RESET_DEFAULT_ADMIN_PASSWORD=true and restart the
      # api container to reset the default admin password back to
      # DEFAULT_ADMIN_PASSWORD. Flip back to false in production.
      RESET_DEFAULT_ADMIN_PASSWORD: ${RESET_DEFAULT_ADMIN_PASSWORD:-false}
      # Public URL used to build absolute links inside outbound emails
      # (password-reset link etc). In production set this to https://yourdomain.tld
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      # SMTP env vars are a *fallback* — the runtime prefers DB SystemSettings
      # values edited live from Admin → Settings → Email. Use these only for
      # initial bootstrap (e.g. so the first onboarding email goes out before
      # an admin has logged in to save the SMTP form).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@iiconacademy.com}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-i-icon academy}
      # WhatsApp env vars are also a fallback. The Cloud API config is too
      # rich for env (phone ID, token, template, language) — configure it
      # in Admin → Settings → WhatsApp instead. The env vars below cover
      # only the legacy "custom HTTP gateway" path.
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-}
      WHATSAPP_API_KEY: ${WHATSAPP_API_KEY:-}
      WHATSAPP_FROM_NUMBER: ${WHATSAPP_FROM_NUMBER:-}
    volumes:
      - uploads_data:/data/uploads
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  mongo_data:
  uploads_data:
